<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Match Tracker</title>
<style>
  body {
    margin: 0; padding: 20px; display: flex; justify-content: center;
    background: #0f1115;
    font: 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .sr-widget { width: 100vw; max-width: 800px; }
</style>
<link rel="stylesheet" href="./theme.css">
</head>
<body>

<div class="sr-widget"></div>

<script>
// ─────────────────────────────────────────────────────────────
// REPLACE with YOUR OWN Sportradar client key.
// Do not reuse DraftKings' key — that is their paid subscription.
// Get one at: https://sportradar.com  (ask for "SIR widgets / LMT Plus")
// ─────────────────────────────────────────────────────────────
const SR_CLIENT_KEY = "0b9c8c7d49a58a644db78b76b453a593";

// Sportradar match ID. Portable across subscriptions.
const MATCH_ID = "63303355";

// Standard Sportradar widget loader
(function (a, b, c, d, e, f, g, h, i) {
  a[e] || (i = a[e] = function () { (a[e].q = a[e].q || []).push(arguments) },
  i.l = 1 * new Date, i.o = f,
  g = b.createElement(c), h = b.getElementsByTagName(c)[0],
  g.async = 1, g.src = d, g.setAttribute("n", e),
  h.parentNode.insertBefore(g, h));
})(window, document, "script",
   "https://widgets.sir.sportradar.com/" + SR_CLIENT_KEY + "/widgetloader",
   // theme:false = "I supply my own theme" -> theme.css
   "SIR", { theme: false, language: "en" });

SIR("addWidget", ".sr-widget", "match.lmtPlus", {
  // Real value from the source page. Colors come from theme.css, not
  // from here — this only mattered earlier because no theme was loaded.
  customBrandColor: "#000000",
  adsFrequency: false,
  layout: "double",
  scoreboard: "disable",
  detailedScoreboard: "disable",
  momentum: "disable",
  tabsPosition: "top",
  language: "en",
  matchId: MATCH_ID,
});
</script>

</body>
</html>
